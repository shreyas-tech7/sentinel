name: ci

# SENTINEL ships no runtime code, so its correctness is the correctness of its
# cross-references — and its credibility depends on not leaking its own secrets.
# Both are enforced here, on every change. See .github/workflows/ci.md for the
# reusable security workflow this repo recommends to the projects it audits.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # gitleaks-action enumerates PR commits via the API on pull_request events

jobs:
  structure:
    name: Structural integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Dead links, dead anchors, catalog <-> remediation class parity, and
      # credential-shaped strings. Standard library only; no install step.
      - name: Check repository invariants
        run: python scripts/check_repo.py

      # Flag when a cited standard (OWASP/CWE/ASVS) has a newer edition than the
      # catalog is grounded in. Advisory: prompts a reviewed migration, never
      # auto-migrates. Standard library only.
      - name: Check standards currency
        run: python scripts/check_standards_currency.py

      # Findings interoperability schema is well-formed and its documented
      # worked example still conforms. Standard library only.
      - name: Check findings schema
        run: python scripts/check_schema.py

      # The only test dependency in the repo. check_schema.py above stays
      # stdlib-only and runs regardless; this installs a real draft-2020-12
      # validator so test_schema_conformance.py can check serialized findings
      # against the contract with a validator rather than by hand.
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.20"

      # Unit tests for the validation scoring harness (precision/recall/F1) and
      # schema conformance of real serialized findings.
      # SENTINEL_REQUIRE_JSONSCHEMA=1 turns a missing validator into a failure
      # instead of a skip -- a green run must mean the check actually executed.
      - name: Validation harness tests
        env:
          SENTINEL_REQUIRE_JSONSCHEMA: "1"
        run: python -m unittest discover -s validation -p 'test_*.py'

      # Skill package rules: single root SKILL.md, kebab-case invariant name,
      # description < 1024 chars with no angle brackets, semver version.
      - name: Check skill package
        run: python scripts/check_skill_package.py

      # Mojibake and encoding damage in tracked text. Two incidents (v7.0, v8.0)
      # came from text round-tripping through a Windows shell that assumes cp1252
      # while the content is UTF-8. Linux CI cannot reproduce that corruption, but
      # it can refuse to accept the result of it.
      - name: Check encoding
        run: python scripts/check_encoding.py

  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan every commit, not just the diff

      # Free for personal accounts (public and private). Organization-owned repos
      # need GITLEAKS_LICENSE. If that blocks you, the structure job's secret
      # check still covers the tracked Markdown.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
